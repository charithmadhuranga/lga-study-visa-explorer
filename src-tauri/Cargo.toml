[package]
name = "lga-study-visa-explorer"
version = "2.0.0"
description = "Full-screen consultation screen for LGA Visa: destinations, universities and courses"
authors = ["Lanka Global Access (Pvt) Ltd"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "lga_study_visa_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# The webview bundle is what matters in dev; keep Rust builds fast.
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
