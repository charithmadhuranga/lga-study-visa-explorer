[package]
name = "lga-study-visa-explorer"
version = "0.1.0"
description = "Full-screen consultation screen for LGA Visa: destinations, universities and courses"
authors = ["Lanka Global Access (Pvt) Ltd"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "lga_study_visa_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.54.1", features = ["time", "sync", "macros", "rt", "fs", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[profile.dev]
# The webview bundle is what matters in dev; keep Rust builds fast.
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
